[pytest]
qt_api = pyside6
timeout = 10
addopts = -n 3
markers =
    smoke: fast critical-path smoke checks
    smoke_ui: smoke tests for UI and UI-adjacent logic
    smoke_data: smoke tests for data import/export/persistence
    smoke_protocol: smoke tests for protocol encode/decode and parsing
    smoke_analysis: smoke tests for amplifier/analysis pipeline
    smoke_workers: smoke tests for worker thread logic
    smoke_spice: smoke tests for SPICE fit/export paths
    smoke_scan: smoke tests for scan grid/counting logic
    smoke_config: smoke tests for config and i18n bootstrap
